<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>災害時共助マップ - 管理者・供給者版</title>
    <style>
        #map {
            height: 100vh;
            width: 100%;
        }
        .info-window {
            font-size: 14px;
            width: 250px;
        }
        .scrollable-info-window {
            max-height: 400px;
            overflow-y: auto;
            padding-right: 15px;
        }
        .info-window h3, .info-window p {
            margin-top: 0;
            margin-bottom: 5px;
        }
        .info-window input, .info-window textarea {
            width: 100%;
            box-sizing: border-box;
            margin-bottom: 10px;
        }
        .status-button-group {
            display: flex;
            gap: 5px;
            margin-top: 10px;
        }
        .status-button-group button {
            flex: 1;
            padding: 8px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            color: white;
            font-weight: bold;
        }
        .btn-blue { background-color: #4CAF50; }
        .btn-yellow { background-color: #FFC107; color: black; }
        .btn-red { background-color: #F44336; }
        .delete-button, .edit-button {
            background-color: #f44336;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 10px;
        }
        .edit-button {
            background-color: #007bff;
        }
        #login-container {
            position: absolute;
            top: 10px;
            right: 10px;
            background: white;
            padding: 15px;
            border-radius: 8px;
            z-index: 1000;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            text-align: center;
        }
        #login-container h4 {
            margin: 0 0 15px 0;
        }
        .user-type-buttons {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .user-type-buttons button {
            padding: 10px 20px;
            border: 1px solid #ddd;
            border-radius: 5px;
            background-color: #f9f9f9;
            cursor: pointer;
            font-size: 16px;
        }
        .user-type-buttons button:hover {
            background-color: #e9e9e9;
        }
        #login-form {
            display: none;
            text-align: left;
            margin-top: 15px;
        }
        #login-form label, #login-form input {
            display: block;
            width: 100%;
            box-sizing: border-box;
            margin-bottom: 10px;
        }
        #login-form input {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .radio-group {
            text-align: left;
            margin-bottom: 10px;
        }
        .radio-group label {
            display: inline-block;
            margin-right: 15px;
            width: auto;
        }
        #confirm-login-button {
            width: 100%;
            padding: 10px;
            border: none;
            background-color: #007bff;
            color: white;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        #back-button {
            margin-top: 10px;
            background: #6c757d;
            color: white;
            padding: 8px 12px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        #user-info {
            display: none;
            text-align: center;
        }
        #user-info h4 {
            margin-bottom: 10px;
        }
        #logout-button {
            background-color: #dc3545;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
        }
        #admin-controls {
            position: absolute;
            top: 10px;
            left: 10px;
            background: white;
            padding: 10px;
            border-radius: 8px;
            z-index: 1000;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            display: none;
            text-align: left;
        }
        #update-button {
            margin-top: 10px;
            padding: 8px 12px;
            border: none;
            background-color: #28a745;
            color: white;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    
    <div id="login-container">
        <div id="user-type-selection">
            <h4>ログイン</h4>
            <div class="user-type-buttons">
                <button id="admin-login-btn">管理者</button>
                <button id="supplier-login-btn">供給者</button>
                <button id="recipient-login-btn">受給者</button>
            </div>
        </div>
        <div id="login-form">
            <h4 id="login-form-title"></h4>
            <div id="email-field" style="display:none;">
                <label for="login-email">メールアドレス:</label>
                <input type="email" id="login-email" placeholder="メールアドレスを入力">
            </div>
            <label for="login-password">パスワード:</label>
            <input type="password" id="login-password" placeholder="パスワードを入力">
            <button id="confirm-login-button">ログイン</button>
            <button id="back-button">戻る</button>
        </div>
        <div id="user-info">
            <h4 id="current-user-status"></h4>
            <button id="logout-button">ログアウト</button>
        </div>
    </div>
    
    <div id="admin-controls">
        <div class="radio-group">
            <p>時間設定を自動で行う：</p>
            <label>
                <input type="radio" name="auto-time-update-all" value="true" checked> する
            </label>
            <label>
                <input type="radio" name="auto-time-update-all" value="false"> しない
            </label>
        </div>
        <button id="update-button">更新</button>
    </div>

    <script>
        const googleMapsApiKey = 'AIzaSyDtiRPQOF6YO8D_sGAPH4I1E93J4G3HilA';
        const adminPassword = 'admin';
        const recipientPassword = '5678';
        let map;
        let markers = [];
        let loggedInUser = null;
        let loggedInUserEmail = null;
        let selectedUserType = null;

        // localStorageからリクエストデータを取得・保存する関数
        function getRequests() {
            return JSON.parse(localStorage.getItem('requests')) || [];
        }

        function saveRequests(requests) {
            localStorage.setItem('requests', JSON.stringify(requests));
        }

        function initMap() {
            map = new google.maps.Map(document.getElementById('map'), {
                center: { lat: 36.170986, lng: 139.310113 },
                zoom: 15,
            });

            loadSuppliersFromLocalStorage();

            map.addListener("click", (event) => {
                if (loggedInUser === 'admin') {
                    const lat = event.latLng.lat();
                    const lng = event.latLng.lng();
                    showRegistrationForm(lat, lng);
                } else {
                    alert('新しいマーカーを登録するには管理者としてログインしてください。');
                }
            });
        }

        function createSupplierMarker(supplier, index) {
            const marker = new google.maps.Marker({
                position: supplier.position,
                map: map,
                title: supplier.name,
                icon: {
                    path: google.maps.SymbolPath.CIRCLE,
                    scale: 10,
                    fillColor: getStatusColor(supplier.status),
                    fillOpacity: 1,
                    strokeWeight: 0,
                }
            });
            
            markers.push(marker);

            const infoWindow = new google.maps.InfoWindow({
                content: createInfoWindowContent(supplier, index)
            });

            marker.addListener("click", () => {
                infoWindow.setContent(createInfoWindowContent(supplier, index));
                infoWindow.open({
                    anchor: marker,
                    map,
                    shouldFocus: false,
                });
            });

            google.maps.event.addListener(infoWindow, 'domready', function() {
                const changeStatus = (newStatus) => {
                    supplier.status = newStatus;
                    supplier.manualStatus = newStatus;
                    updateSupplierInLocalStorage(supplier, index);
                    infoWindow.setContent(createInfoWindowContent(supplier, index));
                    marker.setIcon({
                        path: google.maps.SymbolPath.CIRCLE,
                        scale: 10,
                        fillColor: getStatusColor(newStatus),
                        fillOpacity: 1,
                        strokeWeight: 0,
                    });
                };
                
                const deleteSupplier = () => {
                    deleteSupplierFromLocalStorage(index);
                    clearMarkers();
                    loadSuppliersFromLocalStorage();
                    infoWindow.close();
                };

                const showEditForm = () => {
                    infoWindow.setContent(createEditFormContent(supplier, index));
                    infoWindow.open({
                        anchor: marker,
                        map,
                        shouldFocus: false,
                    });
                    google.maps.event.addListenerOnce(infoWindow, 'domready', function() {
                        document.getElementById('saveEditButton')?.addEventListener('click', () => {
                            editSupplier(index);
                            infoWindow.close();
                        });
                    });
                };

                if (loggedInUser === 'supplier' && loggedInUserEmail === supplier.email) {
                    document.getElementById('blueButton')?.addEventListener('click', () => changeStatus('blue'));
                    document.getElementById('yellowButton')?.addEventListener('click', () => changeStatus('yellow'));
                    document.getElementById('redButton')?.addEventListener('click', () => changeStatus('red'));

                    // 供給者向けリクエスト承認・拒否ボタン
                    document.querySelectorAll('.accept-request-btn').forEach(button => {
                        button.addEventListener('click', (event) => {
                            const requestId = event.target.dataset.requestId;
                            updateRequestStatus(requestId, 'accepted');
                            infoWindow.setContent(createInfoWindowContent(supplier, index));
                        });
                    });
                    document.querySelectorAll('.reject-request-btn').forEach(button => {
                        button.addEventListener('click', (event) => {
                            const requestId = event.target.dataset.requestId;
                            updateRequestStatus(requestId, 'rejected');
                            infoWindow.setContent(createInfoWindowContent(supplier, index));
                        });
                    });
                }
                if (loggedInUser === 'admin') {
                    document.getElementById('deleteButton')?.addEventListener('click', deleteSupplier);
                    document.getElementById('editButton')?.addEventListener('click', showEditForm);
                }
                if (loggedInUser === 'recipient') {
                    const requestButton = document.getElementById('requestButton');
                    if (requestButton) {
                        requestButton.addEventListener('click', () => {
                            infoWindow.close();
                            showRequestInfoWindow(supplier, index);
                        });
                    }
                }
            });
        }

        function createInfoWindowContent(supplier, index) {
            let buttonsHtml = '';
            let adminButtonsHtml = '';
            let emailHtml = '';
            let requestButtonHtml = '';
            let supplierRequestsHtml = '';
            
            const powerSourceText = supplier.powerSource === 'solar' ? '太陽光' : '蓄電池';

            if (loggedInUser === 'supplier' && loggedInUserEmail === supplier.email) {
                buttonsHtml = `
                    <div class="status-button-group">
                        <button id="blueButton" class="btn-blue">可能</button>
                        <button id="yellowButton" class="btn-yellow">若干可能</button>
                        <button id="redButton" class="btn-red">不可能</button>
                    </div>
                `;
                
                const requests = getRequests().filter(req => req.supplierIndex === index);
                if (requests.length > 0) {
                    supplierRequestsHtml = `
                        <div class="scrollable-info-window" style="margin-top: 15px;">
                            <h4>受け取ったリクエスト</h4>
                            ${requests.map(req => `
                                <div style="border-bottom: 1px solid #ccc; padding: 10px 0; margin-bottom: 5px;">
                                    <p><strong>氏名:</strong> ${req.requesterName}</p>
                                    <p><strong>電話番号:</strong> ${req.requesterTel}</p>
                                    <p><strong>住所:</strong> ${req.requesterAddress}</p>
                                    <p><strong>希望時間帯:</strong> ${req.requesterTime}</p>
                                    <p><strong>状態:</strong> ${req.status === 'pending' ? '保留中' : (req.status === 'accepted' ? '承認済み' : '拒否済み')}</p>
                                    ${req.status === 'pending' ? `
                                        <button class="accept-request-btn btn-blue" data-request-id="${req.id}">承認</button>
                                        <button class="reject-request-btn btn-red" data-request-id="${req.id}">拒否</button>
                                    ` : ''}
                                </div>
                            `).join('')}
                        </div>
                    `;
                } else {
                    supplierRequestsHtml = `<p style="margin-top: 15px;">現在、新しいリクエストはありません。</p>`;
                }
            }

            if (loggedInUser === 'admin') {
                adminButtonsHtml = `
                    <button id="editButton" class="edit-button">編集</button>
                    <button id="deleteButton" class="delete-button">削除</button>
                `;
                emailHtml = `<p><strong>メール:</strong> <a href="mailto:${supplier.email}">${supplier.email}</a></p>`;
            }
            
            if (loggedInUser === 'recipient') {
                requestButtonHtml = `<button id="requestButton" class="btn-blue">リクエスト</button>`;
            }
            
            return `
                <div class="info-window">
                    <h3>${supplier.name}</h3>
                    <p><strong>供給源:</strong> ${powerSourceText}</p>
                    <p><strong>提供可能なもの:</strong> ${supplier.supplies || "なし"}</p>
                    ${emailHtml}
                    ${buttonsHtml}
                    ${adminButtonsHtml}
                    ${requestButtonHtml}
                    ${supplierRequestsHtml}
                </div>
            `;
        }

        function createEditFormContent(supplier, index) {
            const isSolar = supplier.powerSource === 'solar';
            const isBattery = supplier.powerSource === 'battery';
            return `
                <div class="info-window">
                    <h3>供給者情報を編集</h3>
                    <label for="edit-name">名前：</label><br>
                    <input type="text" id="edit-name" value="${supplier.name}"><br>
                    <label for="edit-email">メールアドレス：</label><br>
                    <input type="email" id="edit-email" value="${supplier.email}"><br>
                    <label for="edit-supplies">供給できるもの：</label><br>
                    <input type="text" id="edit-supplies" value="${supplier.supplies}"><br>
                    <div class="radio-group">
                        <p>供給源:</p>
                        <label>
                            <input type="radio" name="edit-power-source" value="solar" ${isSolar ? 'checked' : ''}> 太陽光
                        </label>
                        <label>
                            <input type="radio" name="edit-power-source" value="battery" ${isBattery ? 'checked' : ''}> 蓄電池
                        </label>
                    </div>
                    <button id="saveEditButton" class="btn-blue">保存</button>
                </div>
            `;
        }

        function editSupplier(index) {
            const name = document.getElementById('edit-name').value;
            const email = document.getElementById('edit-email').value;
            const supplies = document.getElementById('edit-supplies').value;
            const powerSource = document.querySelector('input[name="edit-power-source"]:checked').value;

            if (!name || !email || !supplies || !powerSource) {
                alert("全ての項目を入力してください。");
                return;
            }

            const suppliers = JSON.parse(localStorage.getItem('suppliers')) || [];
            const supplierToEdit = suppliers[index];
            supplierToEdit.name = name;
            supplierToEdit.email = email;
            supplierToEdit.supplies = supplies;
            supplierToEdit.powerSource = powerSource;

            localStorage.setItem('suppliers', JSON.stringify(suppliers));

            clearMarkers();
            loadSuppliersFromLocalStorage();
        }
        
        // 受給者向けリクエストフォーム
        function showRequestInfoWindow(supplier, supplierIndex) {
            const requestInfoWindow = new google.maps.InfoWindow({
                content: `
                    <div class="info-window scrollable-info-window">
                        <h3>${supplier.name}へリクエスト</h3>
                        <p>下記情報を入力してリクエストを送信してください。</p>
                        <label for="requester-name">氏名：</label><br>
                        <input type="text" id="requester-name" placeholder="氏名" required><br>
                        <label for="requester-tel">電話番号：</label><br>
                        <input type="tel" id="requester-tel" placeholder="090-xxxx-xxxx" required><br>
                        <label for="requester-address">住所：</label><br>
                        <input type="text" id="requester-address" placeholder="住所" required><br>
                        <label for="requester-time">希望時間帯：</label><br>
                        <input type="text" id="requester-time" placeholder="例: 午前中" required><br>
                        <label for="requester-email">連絡用メールアドレス：</label><br>
                        <input type="email" id="requester-email" placeholder="メールアドレス" required><br>
                        <button id="send-request-button" class="btn-blue">リクエストを送信</button>
                    </div>
                `
            });

            requestInfoWindow.open({
                anchor: markers.find(m => m.title === supplier.name),
                map,
                shouldFocus: false,
            });

            google.maps.event.addListenerOnce(requestInfoWindow, 'domready', function() {
                document.getElementById('send-request-button').addEventListener('click', () => {
                    const requesterName = document.getElementById('requester-name').value;
                    const requesterTel = document.getElementById('requester-tel').value;
                    const requesterAddress = document.getElementById('requester-address').value;
                    const requesterTime = document.getElementById('requester-time').value;
                    const requesterEmail = document.getElementById('requester-email').value;

                    if (!requesterName || !requesterTel || !requesterAddress || !requesterTime || !requesterEmail) {
                        alert("全ての項目を入力してください。");
                        return;
                    }

                    const newRequest = {
                        id: Date.now(),
                        supplierIndex: supplierIndex,
                        requesterName,
                        requesterTel,
                        requesterAddress,
                        requesterTime,
                        requesterEmail,
                        status: 'pending'
                    };

                    const requests = getRequests();
                    requests.push(newRequest);
                    saveRequests(requests);

                    alert('リクエストを送信しました。供給者からの返信をお待ちください。');
                    requestInfoWindow.close();
                });
            });
        }

        // リクエストのステータスを更新する関数
        function updateRequestStatus(requestId, newStatus) {
            const requests = getRequests();
            const request = requests.find(req => req.id == requestId);
            if (request) {
                request.status = newStatus;
                saveRequests(requests);
                alert(`リクエストを${newStatus === 'accepted' ? '承認' : '拒否'}しました。`);
            }
        }

        function updateSupplierInLocalStorage(updatedSupplier, index) {
            const suppliers = JSON.parse(localStorage.getItem('suppliers')) || [];
            suppliers[index] = updatedSupplier;
            localStorage.setItem('suppliers', JSON.stringify(suppliers));
        }

        function deleteSupplierFromLocalStorage(index) {
            const suppliers = JSON.parse(localStorage.getItem('suppliers')) || [];
            suppliers.splice(index, 1);
            localStorage.setItem('suppliers', JSON.stringify(suppliers));
        }

        function clearMarkers() {
            for (let i = 0; i < markers.length; i++) {
                markers[i].setMap(null);
            }
            markers = [];
        }

        function showRegistrationForm(lat, lng) {
            if (loggedInUser !== 'admin') {
                alert('新しいマーカーを登録するには管理者としてログインしてください。');
                return;
            }
            
            const infowindow = new google.maps.InfoWindow({
                content: `
                    <div class="info-window">
                        <h3>分電供給者として登録</h3>
                        <p>ここに新しいマーカーを登録します。</p>
                        <label for="name">名前：</label><br>
                        <input type="text" id="name" placeholder="例: 山田様"><br><br>
                        <label for="email">メールアドレス：</label><br>
                        <input type="email" id="email" placeholder="例: example@example.com"><br><br>
                        <label for="password">パスワード：</label><br>
                        <input type="password" id="password" placeholder="パスワードを設定"><br><br>
                        <label for="supplies">供給できるもの：</label><br>
                        <input type="text" id="supplies" placeholder="例: 携帯の充電、お湯"><br><br>
                        <div class="radio-group">
                            <p>供給源:</p>
                            <label>
                                <input type="radio" name="power-source" value="solar" checked> 太陽光
                            </label>
                            <label>
                                <input type="radio" name="power-source" value="battery"> 蓄電池
                            </label>
                        </div>
                        <button id="registerButton">登録</button>
                    </div>
                `
            });

            const tempMarker = new google.maps.Marker({
                position: { lat: lat, lng: lng },
                map: map,
                icon: {
                    path: google.maps.SymbolPath.CIRCLE,
                    scale: 10,
                    fillColor: '#999',
                    fillOpacity: 0.8,
                    strokeWeight: 0,
                }
            });

            infowindow.open({
                anchor: tempMarker,
                map,
                shouldFocus: false,
            });
            
            google.maps.event.addListenerOnce(infowindow, 'domready', function() {
                document.getElementById('registerButton').addEventListener('click', () => {
                    registerSupplier(lat, lng);
                    infowindow.close();
                });
            });

            google.maps.event.addListener(infowindow, 'closeclick', function() {
                tempMarker.setMap(null);
            });
        }

        function registerSupplier(lat, lng) {
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const supplies = document.getElementById('supplies').value;
            const powerSource = document.querySelector('input[name="power-source"]:checked').value;

            if (!name || !email || !password || !supplies || !powerSource) {
                alert("全ての項目を入力してください。");
                return;
            }

            const newSupplier = {
                position: { lat: lat, lng: lng },
                name: name,
                email: email,
                password: password,
                status: "blue",
                manualStatus: "blue",
                supplies: supplies,
                powerSource: powerSource,
            };

            const suppliers = JSON.parse(localStorage.getItem('suppliers')) || [];
            suppliers.push(newSupplier);
            localStorage.setItem('suppliers', JSON.stringify(suppliers));

            setTimeout(() => {
                clearMarkers();
                loadSuppliersFromLocalStorage();
            }, 100);
        }

        function loadSuppliersFromLocalStorage() {
            let suppliers = JSON.parse(localStorage.getItem('suppliers'));
            const autoTimeUpdateAll = JSON.parse(localStorage.getItem('autoTimeUpdateAll'));

            if (suppliers) {
                const currentTime = new Date();
                const currentHour = currentTime.getHours();
                
                if (autoTimeUpdateAll) {
                    suppliers = suppliers.map(supplier => {
                        if (!supplier.manualStatus) {
                            supplier.manualStatus = 'blue';
                        }
                        
                        if (supplier.powerSource === 'solar') {
                            if (currentHour >= 9 && currentHour < 16) {
                                supplier.status = supplier.manualStatus === 'red' ? 'red' : 'blue';
                            } else {
                                supplier.status = 'red';
                            }
                        } else if (supplier.powerSource === 'battery') {
                             supplier.status = supplier.manualStatus;
                         }
                        return supplier;
                    });
                } else {
                     suppliers = suppliers.map(supplier => {
                        if (supplier.manualStatus) {
                            supplier.status = supplier.manualStatus;
                        } else {
                            supplier.status = 'blue';
                            supplier.manualStatus = 'blue';
                        }
                        return supplier;
                    });
                }
                
                localStorage.setItem('suppliers', JSON.stringify(suppliers));

                suppliers.forEach((supplier, index) => {
                    createSupplierMarker(supplier, index);
                });
            }
        }

        function getStatusColor(status) {
            switch (status) {
                case 'blue': return '#4CAF50';
                case 'yellow': return '#FFC107';
                case 'red': return '#F44336';
                default: return '#ccc';
            }
        }

        function showUserTypeSelection() {
            document.getElementById('user-type-selection').style.display = 'block';
            document.getElementById('login-form').style.display = 'none';
            document.getElementById('user-info').style.display = 'none';
            document.getElementById('admin-controls').style.display = 'none';
        }
        
        function showLoginForm() {
            document.getElementById('user-type-selection').style.display = 'none';
            document.getElementById('login-form').style.display = 'block';
            document.getElementById('user-info').style.display = 'none';
            document.getElementById('admin-controls').style.display = 'none';
        }

        function showUserInfo() {
            document.getElementById('user-type-selection').style.display = 'none';
            document.getElementById('login-form').style.display = 'none';
            document.getElementById('user-info').style.display = 'block';
            if (loggedInUser === 'admin') {
                document.getElementById('admin-controls').style.display = 'block';
                const autoUpdateSetting = JSON.parse(localStorage.getItem('autoTimeUpdateAll'));
                if (autoUpdateSetting === false) {
                    document.querySelector('input[name="auto-time-update-all"][value="false"]').checked = true;
                } else {
                    document.querySelector('input[name="auto-time-update-all"][value="true"]').checked = true;
                }
            } else {
                document.getElementById('admin-controls').style.display = 'none';
            }
        }

        document.getElementById('admin-login-btn').addEventListener('click', () => {
            selectedUserType = 'admin';
            showLoginForm();
            document.getElementById('login-form-title').textContent = '管理者としてログイン';
            document.getElementById('email-field').style.display = 'none';
            document.getElementById('login-email').value = '';
            document.getElementById('login-password').value = '';
        });

        document.getElementById('supplier-login-btn').addEventListener('click', () => {
            selectedUserType = 'supplier';
            showLoginForm();
            document.getElementById('login-form-title').textContent = '供給者としてログイン';
            document.getElementById('email-field').style.display = 'block';
            document.getElementById('login-email').value = '';
            document.getElementById('login-password').value = '';
        });

        document.getElementById('recipient-login-btn').addEventListener('click', () => {
            selectedUserType = 'recipient';
            showLoginForm();
            document.getElementById('login-form-title').textContent = '受給者としてログイン';
            document.getElementById('email-field').style.display = 'none';
            document.getElementById('login-email').value = '';
            document.getElementById('login-password').value = '';
        });

        document.getElementById('back-button').addEventListener('click', () => {
            selectedUserType = null;
            showUserTypeSelection();
            document.getElementById('login-email').value = '';
            document.getElementById('login-password').value = '';
        });

        document.getElementById('confirm-login-button').addEventListener('click', () => {
            const password = document.getElementById('login-password').value;
            const email = document.getElementById('login-email').value;
            let success = false;

            if (selectedUserType === 'admin') {
                if (password === adminPassword) {
                    loggedInUser = 'admin';
                    document.getElementById('current-user-status').textContent = '管理者としてログイン中';
                    success = true;
                } else {
                    alert('パスワードが違います。');
                }
            } else if (selectedUserType === 'recipient') {
                if (password === recipientPassword) {
                    loggedInUser = 'recipient';
                    document.getElementById('current-user-status').textContent = '受給者としてログイン中';
                    success = true;
                } else {
                    alert('パスワードが違います。');
                }
            } else if (selectedUserType === 'supplier') {
                const suppliers = JSON.parse(localStorage.getItem('suppliers')) || [];
                const supplier = suppliers.find(s => s.email === email && s.password === password);
                if (supplier) {
                    loggedInUser = 'supplier';
                    loggedInUserEmail = email;
                    document.getElementById('current-user-status').textContent = `${supplier.name}としてログイン中`;
                    success = true;

                    if (supplier.position) {
                        map.setCenter(supplier.position);
                        map.setZoom(18);
                    }
                } else {
                    alert('ログイン情報が違います。');
                }
            }

            if (success) {
                showUserInfo();
                clearMarkers();
                loadSuppliersFromLocalStorage();
            }
        });

        document.getElementById('logout-button').addEventListener('click', () => {
            loggedInUser = null;
            loggedInUserEmail = null;
            selectedUserType = null;
            showUserTypeSelection();
            document.getElementById('login-email').value = '';
            document.getElementById('login-password').value = '';
            clearMarkers();
            loadSuppliersFromLocalStorage();
        });

        document.querySelectorAll('input[name="auto-time-update-all"]').forEach(radio => {
            radio.addEventListener('change', () => {
                const setting = radio.value === 'true';
                localStorage.setItem('autoTimeUpdateAll', JSON.stringify(setting));
                clearMarkers();
                loadSuppliersFromLocalStorage();
            });
        });
        
        document.getElementById('update-button').addEventListener('click', () => {
            clearMarkers();
            loadSuppliersFromLocalStorage();
            alert('マップの表示を更新しました。');
        });

        window.onload = () => {
            loggedInUser = null;
            loggedInUserEmail = null;
            showUserTypeSelection();
            loadSuppliersFromLocalStorage();
        };

    </script>
    <script async defer src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDtiRPQOF6YO8D_sGAPH4I1E93J4G3HilA&callback=initMap"></script>
</body>
</html>
