<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bluetooth Stopwatch App</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto+Mono:wght@500;700&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        /* ==================================================================== */
        /* CSS (デザイン) セクション - 更新版 */
        /* ==================================================================== */
        :root {
            --bg-color: #0A0E12;
            --card-bg-color: #12171D;
            --text-color: #E8E6DF;
            --secondary-text-color: #8A9099;
            --border-color: #262E37;
            --accent-color: #E23B2E;
            --accent-light: #E23B2E20; /* 薄い透明なアクセント色 */
            --button-connect: #2E6DA4;
            --button-start: #1E7A3D;
            --button-stop: #B32B22;
            --button-reset: #B3760F;
            --button-lap: #2C333B; /* 新しいラップボタンの色 */
            --button-import: #1E7A3D;
            --delete-btn-color: #C1440E;
            --export-all-btn-color: #4A4E7A;
            --clear-all-btn-color: #B32B22;
            --disabled-color: #2C333B;
            --led-color: #33FF6E;
            --font-primary: 'Inter', sans-serif;
            --font-heading: 'Oswald', 'Inter', sans-serif;
            --font-display: 'Roboto Mono', monospace;
        }

        button {
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: var(--font-primary);
            text-align: center;
            margin: 0;
            padding: 10px 10px;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            box-sizing: border-box;
            min-height: 100vh;
            min-height: 100dvh;
        }

        .sticky-top {
            position: sticky;
            top: 0;
            z-index: 40;
            width: 100%;
            background-color: var(--bg-color);
            padding-top: 4px;
        }

        .runner-list-header {
            position: sticky;
            top: var(--sticky-offset, 0px);
            z-index: 30;
            background-color: var(--card-bg-color);
            padding-top: 4px;
            padding-bottom: 8px;
            margin: 0 0 4px 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .runner-list-header h2 {
            font-family: var(--font-heading);
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--secondary-text-color);
        }

        h1 {
            font-family: var(--font-heading);
            font-weight: 600;
            color: var(--text-color);
            margin-bottom: 8px;
            margin-top: 4px;
            font-size: clamp(1.1em, 5vw, 2em);
            letter-spacing: 1px;
            text-transform: uppercase;
            padding: 0 44px;
            box-sizing: border-box;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .main-container {
            display: flex;
            flex-direction: column;
            align-items: stretch;
            gap: 12px;
            margin: 10px auto;
            max-width: 800px;
            width: 100%;
            flex: 1;
            min-height: 0;
        }

        .column {
            padding: 12px;
            border-radius: 10px;
            background-color: var(--card-bg-color);
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.4);
            text-align: left;
            display: flex;
            flex-direction: column;
            border: 1px solid var(--border-color);
        }



        /* ストップウォッチ表示エリア */
        .time-display {
            font-family: var(--font-display);
            font-weight: 700;
            font-size: clamp(3em, 16vw, 14em);
            margin-bottom: 10px;
            color: var(--led-color);
            letter-spacing: 2px;
            background: linear-gradient(#101820, #0A0E12);
            padding: 0 5px;
            line-height: 1;
            width: 100%;
            box-sizing: border-box;
            border-radius: 6px;
            border: 2px solid var(--border-color);
            box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.6);
            text-shadow: 0 0 14px rgba(51, 255, 110, 0.55);
            position: relative;
        }

        .time-display::before,
        .time-display::after {
            content: '';
            position: absolute;
            top: 10px;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--border-color);
        }

        .time-display::before { left: 10px; }
        .time-display::after { right: 10px; }

        /* Controls */
        .controls {
            margin-bottom: 10px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            width: 100%;
            box-sizing: border-box;
        }

        .controls button {
            font-family: var(--font-heading);
            font-size: clamp(0.6em, 3.2vw, 2.4em);
            padding: clamp(14px, 5vw, 40px) 2px;
            min-height: clamp(60px, 15vw, 140px);
            width: 100%;
            box-sizing: border-box;
            border: none;
            border-bottom: 4px solid rgba(0, 0, 0, 0.3);
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.15s ease;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            font-weight: 600;
            box-shadow: 0 3px 6px rgba(0, 0, 0, 0.2);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            overflow: hidden;
            white-space: nowrap;
        }

        @media (max-width: 480px) {
            .controls button i {
                display: none;
            }
            .controls button {
                font-size: clamp(0.7em, 3.4vw, 2.4em);
            }
        }

        .controls button:hover:not(:disabled) {
            filter: brightness(1.08);
        }

        .controls button:active:not(:disabled) {
            transform: translateY(2px);
            border-bottom-width: 2px;
        }

        .controls button:disabled {
            background-color: var(--disabled-color);
            cursor: not-allowed;
            opacity: 0.7;
            box-shadow: none;
        }

        #settingsButton {
            position: fixed;
            top: 8px;
            right: 8px;
            z-index: 110;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: none;
            background-color: var(--card-bg-color);
            color: var(--text-color);
            font-size: 1.3em;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border-color);
        }

        .settings-menu {
            position: fixed;
            top: 56px;
            right: 8px;
            z-index: 109;
            background-color: var(--card-bg-color);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            padding: 8px;
            display: none;
            flex-direction: column;
            gap: 6px;
            min-width: 240px;
        }

        .settings-menu.open {
            display: flex;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            z-index: 200;
            align-items: center;
            justify-content: center;
            padding: 16px;
            box-sizing: border-box;
        }

        .modal-overlay.open {
            display: flex;
        }

        .modal-box {
            background-color: var(--card-bg-color);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 16px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
        }

        .modal-box h3 {
            margin: 0 0 8px 0;
            color: var(--text-color);
        }

        .modal-hint {
            font-size: 0.85em;
            color: var(--secondary-text-color);
            margin: 0 0 10px 0;
            line-height: 1.4;
        }

        #csvExportTextarea {
            width: 100%;
            box-sizing: border-box;
            height: 180px;
            background-color: #1a1a1a;
            color: var(--text-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 8px;
            font-family: var(--font-display);
            font-size: 0.8em;
            resize: vertical;
        }

        .modal-btn-row {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }

        .modal-action-btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            color: white;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .settings-menu button {
            font-family: var(--font-heading);
            font-size: 0.95em;
            padding: 12px 16px;
            border: none;
            border-bottom: 3px solid rgba(0, 0, 0, 0.3);
            border-radius: 6px;
            cursor: pointer;
            color: white;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 10px;
            font-weight: 600;
            letter-spacing: 0.4px;
            white-space: nowrap;
            width: 100%;
            box-sizing: border-box;
        }

        .settings-menu button i {
            width: 1.1em;
            text-align: center;
            flex-shrink: 0;
        }

        .settings-toggle-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 10px 4px 4px;
            border-top: 1px solid var(--border-color);
            margin-top: 4px;
        }

        .settings-toggle-label {
            font-family: var(--font-heading);
            font-size: 0.85em;
            letter-spacing: 0.3px;
            color: var(--secondary-text-color);
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .settings-menu .settings-toggle-switch {
            position: relative;
            width: 44px;
            height: 24px;
            border-radius: 12px;
            background-color: var(--disabled-color);
            border: none;
            cursor: pointer;
            flex-shrink: 0;
            padding: 0;
            transition: background-color 0.2s ease;
        }

        .settings-toggle-switch.on {
            background-color: var(--button-start);
        }

        .settings-toggle-knob {
            position: absolute;
            top: 2px;
            left: 2px;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background-color: white;
            transition: transform 0.2s ease;
        }

        .settings-toggle-switch.on .settings-toggle-knob {
            transform: translateX(20px);
        }

        #connectButton { background-color: var(--button-connect); }
        #importRunnersButton { background-color: var(--button-import); }
        #exportAllButton { background-color: var(--export-all-btn-color); }
        #clearAllButton { background-color: var(--clear-all-btn-color); }
        #clearRecordsButton { background-color: var(--delete-btn-color); }

        #connectButton:disabled {
            background-color: var(--disabled-color);
            cursor: not-allowed;
            opacity: 0.7;
            box-shadow: none;
        }
        #startButton { background-color: var(--button-start); }
        #stopButton { background-color: var(--button-stop); }
        #resetButton { background-color: var(--button-reset); }
        #lapButton { background-color: var(--button-lap); }

        .add-runner-btn {
            width: auto;
            padding: 8px 14px;
            background-color: transparent;
            border: 2px dashed var(--accent-color);
            border-radius: 6px;
            cursor: pointer;
            flex-shrink: 0;
            color: var(--accent-color);
            font-size: 0.85em;
            font-weight: 500;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            white-space: nowrap;
        }

        .add-runner-btn:hover {
            background-color: var(--accent-color);
            color: var(--bg-color);
        }

        /* 走者リストのタイル表示用CSS */
        .runner-list {
            flex-grow: 1;
        }
        .runner-list ul {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            list-style: none;
            padding: 0;
            margin: 0;
            justify-content: flex-start;
            max-height: 320px;
            overflow-y: auto;
        }
        .runner-list li {
            width: 100%;
            padding: 20px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background-color: #383838;
            cursor: pointer;
            transition: background-color 0.2s, border-color 0.2s;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .runner-list li:hover {
            background-color: var(--accent-light);
            border-color: var(--accent-color);
        }
        .runner-list li.selected {
            background-color: var(--accent-color);
            color: white;
            border-color: var(--accent-color);
            font-weight: 600;
        }

        .runner-name {
            font-size: 2.6em;
            font-weight: 500;
            color: var(--text-color);
        }

        .delete-btn {
            background: none;
            border: none;
            color: var(--delete-btn-color);
            cursor: pointer;
            font-size: 1em;
            transition: color 0.2s, transform 0.2s;
        }

        .delete-btn:hover {
            color: #ff6347;
            transform: scale(1.1);
        }

        /* 選択された走者の記録リスト */
        .selected-runner-record-list {
            list-style: none;
            padding: 0;
            margin: 0;
            flex-grow: 1;
            overflow-y: auto;
            min-height: 100px;
        }
        .selected-runner-record-list::-webkit-scrollbar {
            width: 6px;
        }
        .selected-runner-record-list::-webkit-scrollbar-thumb {
            background-color: var(--secondary-text-color);
            border-radius: 3px;
        }

        /* ★ヘッダーの新しいレイアウト */
        .header-top-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .header-record-labels {
            display: grid;
            grid-template-columns: 32px 1fr 1fr 32px;
            font-family: var(--font-heading);
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--secondary-text-color);
            margin-bottom: 5px;
        }

        /* ヘッダーの「No」「Lap」「Goal」を個別に配置調整 */
        .header-record-labels span:nth-child(1) { /* No */
            justify-self: start;
        }

        .header-record-labels span:nth-child(2) { /* Lap */
            justify-self: center;
        }

        .header-record-labels span:nth-child(3) { /* Goal */
            justify-self: center; /* 中央に配置し、少し左に寄せる */
        }

        .selected-runner-name {
            font-size: 1.4em;
            font-weight: 600;
            color: var(--accent-color);
        }

        #deleteRunnerButton {
            background-color: var(--delete-btn-color);
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8em;
            transition: background-color 0.3s;
            white-space: nowrap;
        }

        #deleteRunnerButton:hover:not(:disabled) {
            background-color: #ff6347;
        }

        #deleteRunnerButton:disabled {
            background-color: var(--disabled-color);
            cursor: not-allowed;
        }

        .selected-runner-list {
            flex-grow: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
        }
        .selected-runner-record-item {
            padding: 10px 8px;
            border-bottom: 1px solid var(--border-color);
            display: grid;
            grid-template-columns: 32px 1fr 1fr 32px;
            column-gap: 6px;
            align-items: center;
            transition: background-color 0.2s;
        }
        .selected-runner-record-item:last-child {
            border-bottom: none;
        }

        .selected-runner-record-item .record-number {
            font-weight: 500;
            color: var(--secondary-text-color);
            font-size: 1.4em;
            text-align: left; /* Noは左揃え */
            grid-column: 1 / 2;
        }

        .selected-runner-record-item .runner-lap-time {
            font-family: var(--font-display);
            font-weight: 500;
            font-size: clamp(0.9em, 5vw, 1.6em);
            color: var(--text-color);
            text-align: center; /* ラップタイムは中央揃え */
            grid-column: 2 / 3;
            min-width: 0;
        }

        .selected-runner-record-item .runner-goal-time {
            font-family: var(--font-display);
            font-weight: 500;
            font-size: clamp(0.9em, 5vw, 1.6em);
            color: var(--text-color);
            text-align: center; /* ゴールタイムは中央揃え */
            grid-column: 3 / 4;
            min-width: 0;
        }

        .selected-runner-record-item .delete-btn {
            grid-column: 4 / 5;
            justify-self: end;
        }

        .no-record {
            padding: 15px;
            text-align: center;
            color: var(--secondary-text-color);
            font-style: italic;
        }

        .runner-name-input {
            font-family: var(--font-primary);
            font-weight: 500;
            font-size: 0.9em;
            border: 1px solid var(--accent-color);
            border-radius: 4px;
            padding: 4px 6px;
            width: calc(100% - 12px);
            text-align: center;
            background-color: #383838;
            color: var(--accent-color);
            outline: none;
        }

    </style>
</head>
<body>
    <button id="settingsButton" aria-label="設定"><i class="fas fa-cog"></i></button>
    <div id="settingsMenu" class="settings-menu">
        <button id="connectButton"><i class="fas fa-bluetooth-b"></i> デバイスに接続</button>
        <button id="importRunnersButton"><i class="fas fa-file-import"></i> 名簿インポート</button>
        <input type="file" id="importFileInput" accept=".xlsx,.xls" style="display:none">
        <button id="exportAllButton"><i class="fas fa-file-export"></i> データエクスポート</button>
        <button id="clearAllButton"><i class="fas fa-trash-alt"></i> 初期化</button>
        <button id="clearRecordsButton"><i class="fas fa-times-circle"></i> 測定記録のクリア</button>
        <div class="settings-toggle-row" id="voiceAnnounceToggleRow">
            <span class="settings-toggle-label"><i class="fas fa-volume-up"></i> ゴールタイム読み上げ</span>
            <button type="button" class="settings-toggle-switch" id="voiceAnnounceToggle" role="switch" aria-checked="false">
                <span class="settings-toggle-knob"></span>
            </button>
        </div>
    </div>

    <div id="csvExportOverlay" class="modal-overlay">
        <div class="modal-box">
            <h3>データエクスポート</h3>
            <p class="modal-hint">自動ダウンロードされない場合は、下のテキストをコピーして、メモ帳やExcel等に貼り付けて保存してください。</p>
            <textarea id="csvExportTextarea" readonly></textarea>
            <div class="modal-btn-row">
                <button id="csvCopyButton" class="modal-action-btn" style="background-color: var(--accent-color);"><i class="fas fa-copy"></i> コピー</button>
                <button id="csvCloseButton" class="modal-action-btn" style="background-color: var(--disabled-color);"><i class="fas fa-times"></i> 閉じる</button>
            </div>
        </div>
    </div>
    <div class="sticky-top" id="stickyTop">
        <h1>Bluetooth Stopwatch</h1>
        <div class="time-display" id="currentTime">00:00.00</div>

        <div class="controls">
            <button id="startButton"><i class="fas fa-play"></i> START</button>
            <button id="lapButton" disabled><i class="fas fa-forward"></i> LAP</button>
            <button id="stopButton" disabled><i class="fas fa-stop"></i> GOAL</button>
            <button id="resetButton" disabled><i class="fas fa-redo"></i> RESET</button>
        </div>
    </div>

    <div class="main-container">
        <div class="column runner-list">
            <div class="runner-list-header">
                <h2 id="runnerListHeading" style="font-size: 1.2em; margin: 0;">走者リスト</h2>
                <button class="add-runner-btn" id="addRunnerButton"><i class="fas fa-plus"></i> Add</button>
            </div>
            <ul id="runnerList">

            </ul>
        </div>

        <div class="column selected-runner-list">
            <div class="header-top-row">
                <span id="selectedRunnerName" class="selected-runner-name">
                    走者を選択してください
                </span>
                <button id="deleteRunnerButton" disabled>Delete</button>
            </div>
            <div class="header-record-labels">
                <span>No</span>
                <span>Lap</span>
                <span>Goal</span>
                <span></span>
            </div>
            <ul id="recordsList" class="selected-runner-record-list">
                <li class="no-record">記録なし</li>
            </ul>
        </div>
    </div>

    <script>
        /* ==================================================================== */
        /* JavaScript (機能) セクション */
        /* ==================================================================== */
        const SERVICE_UUID = "1b24e5c4-a39c-4d46-92fb-3bbcb2f34a41";
        const CHARACTERISTIC_UUID = "9d18d524-2a6e-44ce-8724-445575b23e9a";

        let device;
        let characteristic;
        let isConnected = false;
        let isConnecting = false;

        let startTime = 0;
        let elapsedTime = 0;
        let timerInterval;
        let isRunning = false;
        let lastTr = 0;

        let runners = [];
        let nextRunnerId = 1;
        let voiceAnnounceEnabled = localStorage.getItem('voiceAnnounceEnabled') === 'true';
        let selectedRunnerId = null;

        const connectButton = document.getElementById('connectButton');
        const settingsButton = document.getElementById('settingsButton');
        const settingsMenu = document.getElementById('settingsMenu');
        const stickyTop = document.getElementById('stickyTop');

        function updateStickyOffset() {
            if (stickyTop) {
                document.documentElement.style.setProperty('--sticky-offset', stickyTop.offsetHeight + 'px');
            }
        }
        updateStickyOffset();
        window.addEventListener('resize', updateStickyOffset);
        window.addEventListener('load', updateStickyOffset);

        const startButton = document.getElementById('startButton');
        const lapButton = document.getElementById('lapButton');
        const stopButton = document.getElementById('stopButton');
        const resetButton = document.getElementById('resetButton');
        const currentTimeDisplay = document.getElementById('currentTime');
        const runnerListElement = document.getElementById('runnerList');
        const selectedRunnerNameElement = document.getElementById('selectedRunnerName');

        const addRunnerButton = document.getElementById('addRunnerButton');
        const exportAllButton = document.getElementById('exportAllButton');
        const importRunnersButton = document.getElementById('importRunnersButton');
        const importFileInput = document.getElementById('importFileInput');
        const deleteRunnerButton = document.getElementById('deleteRunnerButton');
        const clearAllButton = document.getElementById('clearAllButton');
        const clearRecordsButton = document.getElementById('clearRecordsButton');

        // Initial setup
        loadData();

        renderRunnerList();

        // Event Listeners
        settingsButton.addEventListener('click', (event) => {
            event.stopPropagation();
            settingsMenu.classList.toggle('open');
        });
        document.addEventListener('click', (event) => {
            if (settingsMenu.classList.contains('open') &&

        const voiceAnnounceToggle = document.getElementById('voiceAnnounceToggle');

        function updateVoiceAnnounceToggleUI() {
            voiceAnnounceToggle.classList.toggle('on', voiceAnnounceEnabled);
            voiceAnnounceToggle.setAttribute('aria-checked', String(voiceAnnounceEnabled));
        }
        updateVoiceAnnounceToggleUI();

        voiceAnnounceToggle.addEventListener('click', () => {
            voiceAnnounceEnabled = !voiceAnnounceEnabled;

            updateVoiceAnnounceToggleUI();
            if (voiceAnnounceEnabled && 'speechSynthesis' in window) {
                // 初回操作でSafari等の音声合成をアンロックしておく

                window.speechSynthesis.speak(unlockUtterance);

        const csvExportOverlay = document.getElementById('csvExportOverlay');
        const csvExportTextarea = document.getElementById('csvExportTextarea');
        const csvCopyButton = document.getElementById('csvCopyButton');
        const csvCloseButton = document.getElementById('csvCloseButton');

        csvCloseButton.addEventListener('click', () => {

                csvExportOverlay.classList.remove('open');

        });
        csvCopyButton.addEventListener('click', async () => {
            try {
                csvExportTextarea.focus();

                csvExportTextarea.setSelectionRange(0, csvExportTextarea.value.length);
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    await navigator.clipboard.writeText(csvExportTextarea.value);

                }
                csvCopyButton.textContent = 'コピーしました';

                    csvCopyButton.innerHTML = '<i class="fas fa-copy"></i> コピー';
                }, 1500);
            } catch (err) {
                alert('コピーに失敗しました。テキストを長押しして手動でコピーしてください。');
            }
        });
        clearAllButton.addEventListener('click', () => {

        });
        clearRecordsButton.addEventListener('click', () => {
            clearAllRecords();
            settingsMenu.classList.remove('open');
        });

        // ========================
        // データ永続化の関数
        // ========================
        function saveData() {
            localStorage.setItem('runnersData', JSON.stringify(runners));
            localStorage.setItem('nextRunnerId', nextRunnerId);
            localStorage.setItem('selectedRunnerId', selectedRunnerId);
        }

        function loadData() {
            const savedRunners = localStorage.getItem('runnersData');
            const savedNextId = localStorage.getItem('nextRunnerId');
            const savedSelectedId = localStorage.getItem('selectedRunnerId');

            if (savedRunners) {
                runners = JSON.parse(savedRunners);
                nextRunnerId = parseInt(savedNextId, 10);
                selectedRunnerId = parseInt(savedSelectedId, 10);
            } else {
                // 初回アクセス時またはデータがない場合、初期データを設定
                runners = [
                    { id: 1, name: "走者1", records: [] }
                ];
                nextRunnerId = 2;
                selectedRunnerId = 1;
                saveData(); // 初期データを保存
            }
        }

        async function startBluetoothConnectionFlow() {
            isConnecting = true;
            connectButton.textContent = "スキャン中...";
            try {
                device = await navigator.bluetooth.requestDevice({
                    acceptAllDevices: true,
                    optionalServices: [SERVICE_UUID]
                });
                connectButton.textContent = `接続中: ${device.name || '不明なデバイス'}`;
                await connectToDevice(device);
            } catch (error) {
                console.error(`Bluetooth接続エラー: ${error}`);
                alert("Bluetooth接続に失敗しました。デバイスが近くにあるか、ペアリングモードになっているか確認してください。");
                connectButton.textContent = "デバイスに接続";
                isConnecting = false;
            }
        }

        async function connectToDevice(deviceToConnect) {
            try {
                if (!deviceToConnect.gatt.connected) {
                    await deviceToConnect.gatt.connect();
                }
                deviceToConnect.addEventListener('gattserverdisconnected', onDisconnected);
                const server = deviceToConnect.gatt;
                const service = await server.getPrimaryService(SERVICE_UUID);
                characteristic = await service.getCharacteristic(CHARACTERISTIC_UUID);
                await characteristic.startNotifications();
                characteristic.addEventListener('characteristicvaluechanged', handleNotifications);
                isConnected = true;
                isConnecting = false;
                connectButton.textContent = "接続済み";
                connectButton.disabled = true;
                console.log("接続に成功しました。センサーからの通知を待機しています。");
            } catch (error) {
                console.error(`GATT接続エラー: ${error}`);
                connectButton.textContent = "接続エラー";
                isConnecting = false;
                connectButton.disabled = false;
            }
        }

        function onDisconnected(event) {
            console.log(`デバイス ${event.target.name} が切断されました。`);
            isConnected = false;
            connectButton.textContent = "再接続を試行中...";
            connectButton.disabled = false;
            setTimeout(() => {
                if (!isConnecting && !isConnected) {
                    startBluetoothConnectionFlow();
                }
            }, 2000);
        }

        function handleNotifications(event) {
            if (!isConnected) return;

            const value = event.target.value;
            const decoder = new TextDecoder();
            const jsonString = decoder.decode(value);

            try {
                const data = JSON.parse(jsonString);
                const sw = data.sw;
                const tr = data.tr;

                // スイッチのリセットを優先して処理
                if (sw > 0) { // Reset
                    resetStopwatch();
                    lastTr = 0;
                    return;
                }

                // センサーのトリガーを処理
                if (tr !== lastTr) {
                    if (tr === 1) { // START_TRG
                        startStopwatch();
                    } else if (isRunning) {
                        if (tr === 2 || tr === 4) { // Lap
                            recordLapGoal("Lap");
                        } else if (tr === 8) { // GOAL_TRG
                            recordLapGoal("Goal");
                            stopStopwatch();
                            lastTr = 0; // GOAL検知後にlastTrをリセット
                        }
                    }
                }

                if (tr !== 8) { // GOAL以外の値であれば、lastTrを更新
                    lastTr = tr;
                }


            } catch (e) {
                console.error(`JSONパースエラー: ${e}`);
            }
        }

        function startStopwatch() {
            if (isRunning) return;
            if (selectedRunnerId === null) {
                alert("記録する走者を選択してください。");
                return;
            }
            isRunning = true;
            startTime = Date.now() - elapsedTime;
            timerInterval = setInterval(() => {
                elapsedTime = Date.now() - startTime;
                updateTimeDisplay(elapsedTime);
            }, 10);
            startButton.disabled = true;
            lapButton.disabled = false;
            stopButton.disabled = false;
            resetButton.disabled = true;
        }

        function stopStopwatch() {
            if (!isRunning) return;
            isRunning = false;
            clearInterval(timerInterval);
            startButton.disabled = false;
            lapButton.disabled = true;
            stopButton.disabled = true;
            resetButton.disabled = false;
        }

        function resetStopwatch() {
            clearInterval(timerInterval);
            isRunning = false;
            elapsedTime = 0;
            updateTimeDisplay(0);
            startButton.disabled = false;
            lapButton.disabled = true;
            stopButton.disabled = true;
            resetButton.disabled = true;
            selectNextRunner();
        }

        function selectNextRunner() {
            if (runners.length === 0) {
                return;
            }
            const currentIndex = runners.findIndex(r => r.id === selectedRunnerId);
            const nextIndex = currentIndex === -1 ? 0 : (currentIndex + 1) % runners.length;
            selectedRunnerId = runners[nextIndex].id;
            renderRunnerList();
            renderSelectedRunnerRecords();
            saveData();
            scrollSelectedRunnerIntoView();
        }

        function scrollSelectedRunnerIntoView() {
            const selectedLi = runnerListElement.querySelector('li.selected');
            if (selectedLi) {
                selectedLi.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
            }
        }

        function updateTimeDisplay(milliseconds) {
            const totalSeconds = Math.floor(milliseconds / 1000);
            const hundredthsOfSeconds = Math.floor((milliseconds % 1000) / 10);
            const seconds = totalSeconds % 60;
            const minutes = Math.floor(totalSeconds / 60);

            const format = (num) => num.toString().padStart(2, '0');
            const formatHundredths = (num) => num.toString().padStart(2, '0');

            currentTimeDisplay.textContent = `${format(minutes)}:${format(seconds)}.${formatHundredths(hundredthsOfSeconds)}`;
        }

        function recordLapGoal(triggerType) {
            if (selectedRunnerId === null) {
                return null;
            }
            const runner = runners.find(r => r.id === selectedRunnerId);
            if (!runner || !isRunning) {
                return null;
            }

            const currentTime = formatTime(elapsedTime);
            let latestRecord = runner.records[0];

            // 最新の記録がラップタイムのみを持っている場合、そこにゴールタイムを追加する
            if (latestRecord && triggerType === "Goal" && latestRecord.lapTime && !latestRecord.goalTime) {
                latestRecord.goalTime = currentTime;
            } else {
                // それ以外の場合は、常に新しい記録を作成する
                const newRecord = {
                    time: elapsedTime,
                    lapTime: triggerType === "Lap" ? currentTime : "",
                    goalTime: triggerType === "Goal" ? currentTime : ""
                };
                runner.records.unshift(newRecord);
            }

            renderSelectedRunnerRecords();
            saveData();

            return { runnerName: runner.name, time: currentTime };
        }

        function scheduleGoalAnnouncement(goalInfo) {
            if (!voiceAnnounceEnabled) return;
            if (!('speechSynthesis' in window)) return;

            setTimeout(() => {
                announceGoalTime(goalInfo);
            }, 3000);
        }

        function announceGoalTime(goalInfo) {
            const spokenText = timeToSpokenJapanese(goalInfo.time);
            const utterance = new SpeechSynthesisUtterance(spokenText);
            utterance.lang = 'ja-JP';
            utterance.rate = 1.0;
            window.speechSynthesis.cancel();
            window.speechSynthesis.speak(utterance);
        }

        function timeToSpokenJapanese(formattedTime) {
            // formattedTime: "MM:SS.HH"
            const match = formattedTime.match(/^(\d{2}):(\d{2})\.(\d{2})$/);
            if (!match) return formattedTime;
            const minutes = parseInt(match[1], 10);
            const seconds = parseInt(match[2], 10);
            const hundredthsStr = match[3]; // "05"や"15"のまま(先頭ゼロを保持)

            const digitKana = ['ゼロ', 'いち', 'に', 'さん', 'よん', 'ご', 'ろく', 'なな', 'はち', 'きゅう'];
            const hundredthsSpoken = hundredthsStr.split('').map(d => digitKana[parseInt(d, 10)]).join('');

            let parts = [];
            if (minutes > 0) {
                parts.push(`${minutes}分`);
            }
            parts.push(`${seconds}秒`);
            parts.push(hundredthsSpoken);
            return parts.join('');
        }

        function deleteRunner(runnerId) {
            if (runnerId === null) return;
            const runner = runners.find(r => r.id === runnerId);
            if (runner && confirm(`${runner.name} とその全ての記録を削除しますか？`)) {
                runners = runners.filter(r => r.id !== runnerId);
                if (selectedRunnerId === runnerId) {
                    selectedRunnerId = null;
                }
                renderRunnerList();
                renderSelectedRunnerRecords();
                saveData(); // データの変更を保存
            }
        }

        function deleteRecord(recordIndex) {
            const runner = runners.find(r => r.id === selectedRunnerId);
            if (runner && confirm("この記録を削除しますか？")) {
                runner.records.splice(recordIndex, 1);
                renderSelectedRunnerRecords();
                saveData(); // データの変更を保存
            }
        }

        function clearAllData() {
            if (confirm("全ての走者データと記録を削除します。よろしいですか？この操作は元に戻せません。")) {
                runners = [];
                nextRunnerId = 1;
                selectedRunnerId = null;
                saveData();
                renderRunnerList();
                renderSelectedRunnerRecords();
                alert("全てのデータを削除しました。");
            }
        }

        function clearAllRecords() {
            if (confirm("全ての走者の記録のみを削除します。走者データは残ります。よろしいですか？")) {
                runners.forEach(runner => {
                    runner.records = [];
                });
                saveData();
                renderSelectedRunnerRecords();
                alert("全ての記録を削除しました。");
            }
        }

        function handleRunnerImportFile(event) {
            const file = event.target.files && event.target.files[0];
            if (!file) return;

            if (typeof XLSX === 'undefined') {
                alert('インポート機能の読み込みに失敗しました。通信環境を確認して再度お試しください。');
                return;
            }

            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const firstSheetName = workbook.SheetNames[0];
                    const sheet = workbook.Sheets[firstSheetName];
                    const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });

                    if (!rows || rows.length === 0) {
                        alert('名簿データが見つかりませんでした。');
                        return;
                    }

                    // "氏名" 列を探す（見つからなければ1列目を使用）
                    const headerRow = rows[0].map(cell => String(cell).trim());
                    let nameColIndex = headerRow.findIndex(h => h === '氏名');
                    let startRow = 1;
                    if (nameColIndex === -1) {
                        nameColIndex = 0;
                        startRow = 0; // ヘッダーが無い場合は1行目からデータとして扱う
                    }

                    const importedNames = [];
                    for (let i = startRow; i < rows.length; i++) {
                        const row = rows[i];
                        if (!row) continue;
                        const rawName = row[nameColIndex];
                        const name = rawName === undefined || rawName === null ? '' : String(rawName).trim();
                        if (name) {
                            importedNames.push(name);
                        }
                    }

                    if (importedNames.length === 0) {
                        alert('インポート可能な氏名が見つかりませんでした。「氏名」列があるか確認してください。');
                        return;
                    }

                    importedNames.forEach(name => {
                        const newRunner = { id: nextRunnerId, name: name, records: [] };
                        runners.push(newRunner);
                        nextRunnerId++;
                    });

                    renderRunnerList();
                    saveData();
                    settingsMenu.classList.remove('open');
                    alert(`${importedNames.length}名の走者をインポートしました。`);
                } catch (err) {
                    console.error(err);
                    alert('ファイルの読み込みに失敗しました。Excel形式(.xlsx)のファイルか確認してください。');
                }
            };
            reader.readAsArrayBuffer(file);
        }

        function addRunner() {
            const newRunner = { id: nextRunnerId, name: `走者${nextRunnerId}`, records: [] };
            runners.push(newRunner);
            nextRunnerId++;
            renderRunnerList();
            selectedRunnerId = newRunner.id;
            renderSelectedRunnerRecords();
            saveData(); // データの変更を保存
        }

        function selectRunner(event) {
            const listItem = event.target.closest('li');
            if (listItem && !listItem.querySelector('.runner-name-input')) {
                const runnerId = parseInt(listItem.dataset.id);
                selectedRunnerId = runnerId;

                document.querySelectorAll('#runnerList li').forEach(li => li.classList.remove('selected'));
                listItem.classList.add('selected');

                renderSelectedRunnerRecords();
                saveData(); // データの変更を保存
            }
        }

        function renderRunnerList() {
            runnerListElement.innerHTML = '';
            if (runners.length === 0 && selectedRunnerId !== null) {
                selectedRunnerId = null;
            }
            runners.forEach(runner => {
                const li = document.createElement('li');
                li.dataset.id = runner.id;

                const runnerNameSpan = document.createElement('span');
                runnerNameSpan.classList.add('runner-name');
                runnerNameSpan.textContent = runner.name;
                runnerNameSpan.addEventListener('dblclick', (e) => editRunnerName(e.currentTarget, runner.id));

                li.appendChild(runnerNameSpan);

                if (runner.id === selectedRunnerId) {
                    li.classList.add('selected');
                }
                runnerListElement.appendChild(li);
            });
            if (selectedRunnerId === null && runners.length > 0) {
                selectedRunnerId = runners[0].id;
                renderRunnerList();
                renderSelectedRunnerRecords();
            } else if (runners.length === 0) {
                 renderSelectedRunnerRecords();
            }
        }

        function editRunnerName(targetElement, runnerId) {
            const runner = runners.find(r => r.id === runnerId);
            if (!runner) return;

            const oldName = runner.name;
            const input = document.createElement('input');
            input.type = 'text';
            input.value = oldName;
            input.classList.add('runner-name-input');

            targetElement.innerHTML = '';
            targetElement.appendChild(input);
            input.focus();
            input.select();

            const saveName = () => {
                const newName = input.value.trim();
                if (newName && newName !== oldName) {
                    runner.name = newName;
                    renderRunnerList();
                    renderSelectedRunnerRecords();
                    saveData(); // データの変更を保存
                } else {
                    renderRunnerList();
                }
            };

            input.addEventListener('blur', saveName);
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    saveName();
                }
            });
        }

        function renderSelectedRunnerRecords() {
            recordsListElement.innerHTML = '';

            if (selectedRunnerId === null) {
                selectedRunnerNameElement.textContent = `走者を選択してください`;
                deleteRunnerButton.disabled = true;
                const noRecordLi = document.createElement('li');
                noRecordLi.classList.add('no-record');
                noRecordLi.textContent = "記録なし";
                recordsListElement.appendChild(noRecordLi);
                return;
            }

            const runner = runners.find(r => r.id === selectedRunnerId);
            if (runner) {
                selectedRunnerNameElement.textContent = `${runner.name}`;
                deleteRunnerButton.disabled = false;

                if (runner.records.length > 0) {
                    const reversedRecords = runner.records;
                    reversedRecords.forEach((record, index) => {
                        const li = document.createElement('li');
                        li.classList.add('selected-runner-record-item');
                        li.dataset.index = index;

                        const recordNumberSpan = document.createElement('span');
                        recordNumberSpan.classList.add('record-number');
                        recordNumberSpan.textContent = `${reversedRecords.length - index}`;

                        const lapTimeSpan = document.createElement('span');
                        lapTimeSpan.classList.add('runner-lap-time');
                        lapTimeSpan.textContent = record.lapTime;

                        const goalTimeSpan = document.createElement('span');
                        goalTimeSpan.classList.add('runner-goal-time');
                        goalTimeSpan.textContent = record.goalTime;

                        const deleteButton = document.createElement('button');
                        deleteButton.classList.add('delete-btn');
                        deleteButton.innerHTML = '<i class="fas fa-trash-alt"></i>';

                        li.appendChild(recordNumberSpan);
                        li.appendChild(lapTimeSpan);
                        li.appendChild(goalTimeSpan);
                        li.appendChild(deleteButton);
                        recordsListElement.appendChild(li);
                    });
                } else {
                    const noRecordLi = document.createElement('li');
                    noRecordLi.classList.add('no-record');
                    noRecordLi.textContent = "記録なし";
                    recordsListElement.appendChild(noRecordLi);
                }
            } else {
                selectedRunnerId = null;
                renderRunnerList();
                renderSelectedRunnerRecords();
            }
        }

        function handleGlobalKeydown(e) {
            if (e.key === 'Enter' && e.target.tagName === 'INPUT') {
                e.target.blur();
            }
        }

        function formatTime(milliseconds) {
            const totalSeconds = Math.floor(milliseconds / 1000);
            const seconds = totalSeconds % 60;
            const minutes = Math.floor(totalSeconds / 60);
            const hundredths = Math.floor((milliseconds % 1000) / 10);

            const format = (num) => num.toString().padStart(2, '0');
            const formatHundredths = (num) => num.toString().padStart(2, '0');

            return `${format(minutes)}:${format(seconds)}.${formatHundredths(hundredths)}`;
        }

        function escapeCsv(str) {
            if (str && (str.includes(',') || str.includes('"') || str.includes('\n'))) {
                return `"${str.replace(/"/g, '""')}"`;
            }
            return str;
        }

        function convertToCsvString(runnersData) {
            if (runnersData.length === 0) return "";

            let maxRecords = 0;
            runnersData.forEach(runner => {
                if (runner.records.length > maxRecords) {
                    maxRecords = runner.records.length;
                }
            });

            let header = `"氏名"`;
            for (let i = 0; i < maxRecords; i++) {
                header += `,${escapeCsv(`${i + 1}Lap`)},${escapeCsv(`${i + 1}Goal`)}`;
            }
            let csv = header + "\n";

            runnersData.forEach(runner => {
                let row = escapeCsv(runner.name);
                const reversedRecords = runner.records; // Fix: No need to reverse again
                for (let i = 0; i < maxRecords; i++) {
                    if (i < reversedRecords.length) {
                        const record = reversedRecords[i];
                        const lapTime = record.lapTime ? `'${record.lapTime}` : "";
                        const goalTime = record.goalTime ? `'${record.goalTime}` : "";
                        row += `,${escapeCsv(lapTime)},${escapeCsv(goalTime)}`;
                    } else {
                        row += `,,`;
                    }
                }
                csv += row + "\n";
            });
            return csv;
        }

        function exportAllToCsv() {
            if (runners.length === 0) {
                alert("エクスポートする走者がいません。");
                return;
            }

            const csvContent = convertToCsvString(runners);
            downloadCsv(csvContent, "全走者記録.csv");
        }

        function showCsvExportModal(csvContent) {
            const overlay = document.getElementById('csvExportOverlay');
            const textarea = document.getElementById('csvExportTextarea');
            textarea.value = csvContent;
            overlay.classList.add('open');
        }

        async function downloadCsv(csvContent, filename) {
            const BOM = new Uint8Array([0xEF, 0xBB, 0xBF]);
            const blob = new Blob([BOM, csvContent], { type: 'text/csv;charset=utf-8;' });

            // モバイル端末(iOS/Android)ではWeb Share APIでネイティブの共有シート
            // (AirDrop/メール/メッセージ/ファイルに保存 等)を優先表示する。
            // PCのブラウザは共有シートの体験が不安定なため対象外にする。
            const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

            if (isMobile && navigator.canShare && navigator.share) {
                try {
                    const file = new File([blob], filename, { type: 'text/csv' });
                    if (navigator.canShare({ files: [file] })) {
                        await navigator.share({ files: [file], title: filename });
                        return;
                    }
                } catch (err) {
                    if (err && err.name === 'AbortError') {
                        // ユーザーが共有をキャンセルした場合は何もしない
                        return;
                    }
                    // 共有に失敗した場合は通常のダウンロードにフォールバック
                }
            }

            const link = document.createElement("a");
            if (link.download !== undefined) {
                const url = URL.createObjectURL(blob);
                link.setAttribute("href", url);
                link.setAttribute("download", filename);
                link.style.visibility = 'hidden';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                setTimeout(() => URL.revokeObjectURL(url), 3000);
            }

            // Web Share APIが使えない環境向けに、コピー用のフォールバック画面も表示
            showCsvExportModal(csvContent);
        }
    </script>

</body>
